<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NPTEL Machine Learning — Mock Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F1E6; --surface:#FFFFFF; --surface-2:#ECE7D8; --border:#DED6BF;
  --ink:#232A22; --ink-soft:#5B6459; --accent:#1D6B62; --accent-ink:#FFFFFF;
  --accent-2:#B3791D; --good:#2E7D4F; --good-bg:#E4F3E9; --bad:#B1443A; --bad-bg:#FBE7E4;
  --warn:#B3791D; --radius:14px; --radius-sm:9px;
  --font-serif:'Lora',Georgia,'Times New Roman',serif; --font-sans:'Inter',system-ui,-apple-system,sans-serif;
  --shadow:0 1px 2px rgba(35,42,34,0.06), 0 4px 14px rgba(35,42,34,0.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#181C17; --surface:#20251E; --surface-2:#262B22; --border:#38402F;
    --ink:#EDEFE7; --ink-soft:#A9B2A0; --accent:#4FBFA8; --accent-ink:#0C1210;
    --accent-2:#E0AC4C; --good:#69C98B; --good-bg:#1D3327; --bad:#F2897E; --bad-bg:#3A2320;
    --warn:#E0AC4C; --shadow:0 1px 2px rgba(0,0,0,0.3), 0 4px 18px rgba(0,0,0,0.35);
  }
}
:root[data-theme="dark"]{
  --bg:#181C17; --surface:#20251E; --surface-2:#262B22; --border:#38402F;
  --ink:#EDEFE7; --ink-soft:#A9B2A0; --accent:#4FBFA8; --accent-ink:#0C1210;
  --accent-2:#E0AC4C; --good:#69C98B; --good-bg:#1D3327; --bad:#F2897E; --bad-bg:#3A2320;
  --warn:#E0AC4C; --shadow:0 1px 2px rgba(0,0,0,0.3), 0 4px 18px rgba(0,0,0,0.35);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--font-sans); background:var(--bg); color:var(--ink);
  -webkit-font-smoothing:antialiased;
}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px;}
h1,h2,h3,h4{font-family:var(--font-serif); font-weight:600; margin:0 0 6px 0; line-height:1.25;}
p{margin:0 0 8px 0;}
button{font-family:var(--font-sans);cursor:pointer;}
a{color:var(--accent);}
#app{display:flex; min-height:100vh; width:100%;}
 
/* ---- layout ---- */
.sidebar{
  width:230px; flex-shrink:0; background:var(--surface); border-right:1px solid var(--border);
  padding:20px 14px; position:sticky; top:0; height:100vh; overflow-y:auto;
}
.brand{display:flex; align-items:center; gap:10px; padding:2px 8px 20px 8px;}
.brand-badge{width:36px;height:36px;border-radius:10px;background:var(--accent);color:var(--accent-ink);
  display:flex;align-items:center;justify-content:center;font-family:var(--font-serif);font-weight:700;font-size:16px;flex-shrink:0;}
.brand-text{font-family:var(--font-serif);font-weight:700;font-size:15px;line-height:1.15;}
.brand-text span{display:block;font-family:var(--font-sans);font-weight:500;font-size:11px;color:var(--ink-soft);}
.nav-item{
  display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:var(--radius-sm);
  color:var(--ink-soft); font-weight:500; font-size:14px; margin-bottom:2px; border:none; background:none; width:100%; text-align:left;
}
.nav-item:hover{background:var(--surface-2); color:var(--ink);}
.nav-item.active{background:var(--accent); color:var(--accent-ink);}
.nav-icon{width:18px;text-align:center;flex-shrink:0;}
.sidebar-foot{margin-top:18px; padding:12px; border-top:1px solid var(--border); font-size:12px; color:var(--ink-soft);}
.theme-row{display:flex;gap:6px;margin-top:8px;}
.theme-btn{flex:1;padding:6px 4px;font-size:11px;border-radius:8px;border:1px solid var(--border);background:var(--surface-2);color:var(--ink-soft);}
.theme-btn.active{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);}
 
.main{flex:1; min-width:0; padding:26px 30px 60px 30px;}
.topbar-mobile{display:none;}
 
@media (max-width: 880px){
  .sidebar{position:fixed; left:-250px; z-index:40; transition:left .2s ease; box-shadow:var(--shadow);}
  .sidebar.open{left:0;}
  .main{padding:70px 14px 40px 14px;}
  .topbar-mobile{
    display:flex; position:fixed; top:0; left:0; right:0; height:54px; background:var(--surface);
    border-bottom:1px solid var(--border); align-items:center; padding:0 12px; z-index:30; gap:10px;
  }
  .hamburger{background:none;border:none;font-size:20px;color:var(--ink);padding:6px;}
  .overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:35;}
  .overlay.show{display:block;}
}
 
.container{max-width:980px; margin:0 auto;}
.header-row{display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:10px; margin-bottom:22px;}
.page-title{font-size:26px;}
.page-sub{color:var(--ink-soft); font-size:14.5px; max-width:560px;}
 
.card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:18px 20px; box-shadow:var(--shadow);}
.grid{display:grid; gap:14px;}
.grid-stats{grid-template-columns:repeat(4,1fr);}
.grid-2{grid-template-columns:1fr 1fr;}
.grid-3{grid-template-columns:1fr 1fr 1fr;}
@media (max-width:820px){.grid-stats{grid-template-columns:repeat(2,1fr);} .grid-2,.grid-3{grid-template-columns:1fr;}}
 
.stat-card{padding:16px 18px;}
.stat-label{font-size:12.5px; color:var(--ink-soft); font-weight:500; margin-bottom:6px;}
.stat-value{font-family:var(--font-serif); font-size:26px; font-weight:700;}
.stat-sub{font-size:12px; color:var(--ink-soft); margin-top:3px;}
 
.btn{
  border-radius:10px; border:1px solid var(--border); background:var(--surface-2); color:var(--ink);
  padding:10px 16px; font-weight:600; font-size:14px; display:inline-flex; align-items:center; gap:8px;
}
.btn:hover{filter:brightness(0.97);}
.btn-primary{background:var(--accent); color:var(--accent-ink); border-color:var(--accent);}
.btn-primary:disabled{opacity:.5; cursor:not-allowed;}
.btn-ghost{background:transparent; border-color:var(--border);}
.btn-danger{background:var(--bad); color:#fff; border-color:var(--bad);}
.btn-lg{padding:16px 26px; font-size:16px; border-radius:14px;}
.btn-block{width:100%; justify-content:center;}
.btn-sm{padding:6px 10px; font-size:12.5px; border-radius:8px;}
 
.badge{display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:999px; font-size:11.5px; font-weight:600; border:1px solid var(--border); background:var(--surface-2); color:var(--ink-soft);}
.badge-accent{background:var(--accent); color:var(--accent-ink); border-color:var(--accent);}
.badge-gold{background:var(--accent-2); color:#221800; border-color:var(--accent-2);}
.badge-good{background:var(--good-bg); color:var(--good); border-color:transparent;}
.badge-bad{background:var(--bad-bg); color:var(--bad); border-color:transparent;}
 
.week-row{display:flex; align-items:center; gap:12px; padding:7px 0;}
.week-row .wk-label{width:64px; font-size:13px; font-weight:600; flex-shrink:0;}
.progress-track{flex:1; height:10px; background:var(--surface-2); border-radius:6px; overflow:hidden;}
.progress-fill{height:100%; background:var(--accent); border-radius:6px; transition:width .4s ease;}
.week-row .wk-pct{width:44px; text-align:right; font-size:12px; color:var(--ink-soft); flex-shrink:0;}
 
.section-title{font-size:15px; font-weight:700; margin:26px 0 12px 0; font-family:var(--font-serif);}
.section-title:first-child{margin-top:0;}
 
.mode-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:12px;}
@media (max-width:820px){.mode-grid{grid-template-columns:1fr 1fr;}}
.mode-card{padding:16px; text-align:left; border-radius:var(--radius); cursor:pointer;}
.mode-card h4{font-size:14.5px; margin-bottom:4px;}
.mode-card p{font-size:12.5px; color:var(--ink-soft); margin:0;}
.mode-card:hover{border-color:var(--accent);}
 
.diff-row{display:flex; gap:8px; flex-wrap:wrap; margin:10px 0 18px 0;}
.diff-btn{padding:8px 16px; border-radius:999px; border:1px solid var(--border); background:var(--surface); font-weight:600; font-size:13px;}
.diff-btn.active{background:var(--ink); color:var(--bg); border-color:var(--ink);}
 
/* question view */
.q-top{display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; margin-bottom:14px;}
.q-progress-wrap{display:flex; align-items:center; gap:14px; flex:1; min-width:220px;}
.q-progress-track{flex:1; height:8px; background:var(--surface-2); border-radius:6px; overflow:hidden;}
.q-progress-fill{height:100%; background:var(--accent);}
.timer-box{font-family:var(--font-serif); font-weight:700; font-size:18px; padding:6px 14px; border-radius:10px; background:var(--surface-2); border:1px solid var(--border);}
.timer-box.low{color:var(--bad); border-color:var(--bad);}
.score-strip{display:flex; gap:18px; font-size:13px; color:var(--ink-soft); margin-bottom:16px; flex-wrap:wrap;}
.score-strip b{color:var(--ink);}
.q-tags{display:flex; gap:8px; margin-bottom:10px; flex-wrap:wrap;}
.q-text{font-size:17px; line-height:1.55; margin:6px 0 18px 0; font-weight:500;}
.opt{
  display:flex; align-items:flex-start; gap:12px; padding:13px 15px; border:1.5px solid var(--border);
  border-radius:12px; margin-bottom:9px; cursor:pointer; background:var(--surface); font-size:14.5px; line-height:1.45;
}
.opt:hover{border-color:var(--accent);}
.opt.selected{border-color:var(--accent); background:var(--surface-2);}
.opt.correct{border-color:var(--good); background:var(--good-bg);}
.opt.incorrect{border-color:var(--bad); background:var(--bad-bg);}
.opt .marker{width:19px;height:19px;border-radius:50%;border:2px solid var(--border);flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;font-size:11px;}
.opt.msq .marker{border-radius:5px;}
.opt.selected .marker{border-color:var(--accent); background:var(--accent); color:var(--accent-ink);}
.opt.correct .marker{border-color:var(--good); background:var(--good); color:#fff;}
.opt.incorrect .marker{border-color:var(--bad); background:var(--bad); color:#fff;}
.num-input{width:220px; padding:13px 14px; font-size:15px; border-radius:10px; border:1.5px solid var(--border); background:var(--surface); color:var(--ink);}
.num-input:focus{outline:none; border-color:var(--accent);}
 
.feedback-panel{margin-top:18px; padding:16px 18px; border-radius:var(--radius); border:1.5px solid; animation:pop .18s ease;}
@keyframes pop{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);}}
.feedback-panel.ok{border-color:var(--good); background:var(--good-bg);}
.feedback-panel.no{border-color:var(--bad); background:var(--bad-bg);}
.feedback-head{display:flex; align-items:center; gap:8px; font-weight:700; font-size:15px; margin-bottom:8px;}
.feedback-panel.ok .feedback-head{color:var(--good);}
.feedback-panel.no .feedback-head{color:var(--bad);}
.feedback-row{font-size:13.5px; margin-bottom:6px;}
.feedback-row b{font-weight:700;}
.exp-box{margin-top:8px; padding-top:8px; border-top:1px solid rgba(0,0,0,.08); font-size:13.5px; color:var(--ink-soft);}
 
.footer-actions{display:flex; justify-content:flex-end; gap:10px; margin-top:18px;}
 
/* result page */
.result-hero{text-align:center; padding:34px 20px;}
.result-score{font-family:var(--font-serif); font-size:52px; font-weight:700; margin:6px 0;}
.result-max{font-size:16px; color:var(--ink-soft);}
.result-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-top:20px;}
@media (max-width:700px){.result-grid{grid-template-columns:repeat(2,1fr);}}
 
.bar-chart-row{display:flex; align-items:center; gap:12px; padding:6px 0;}
.bar-chart-row .lab{width:110px; font-size:13px; flex-shrink:0;}
.bar-chart-row .val{width:44px; text-align:right; font-size:12px; color:var(--ink-soft); flex-shrink:0;}
 
.qbank-item{padding:14px 16px; border-bottom:1px solid var(--border);}
.qbank-item:last-child{border-bottom:none;}
.qbank-top{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:6px; align-items:center;}
.qbank-q{font-size:14px; font-weight:500;}
.filter-bar{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px;}
.chip{padding:6px 12px; border-radius:999px; border:1px solid var(--border); background:var(--surface); font-size:12.5px; font-weight:600; color:var(--ink-soft);}
.chip.active{background:var(--ink); color:var(--bg); border-color:var(--ink);}
.search-input{width:100%; padding:11px 14px; border-radius:10px; border:1px solid var(--border); background:var(--surface); color:var(--ink); font-size:14px; margin-bottom:14px;}
.search-input:focus{outline:none; border-color:var(--accent);}
 
.settings-row{display:flex; justify-content:space-between; align-items:center; padding:14px 0; border-bottom:1px solid var(--border); gap:14px; flex-wrap:wrap;}
.settings-row:last-child{border-bottom:none;}
.settings-label{font-size:14px; font-weight:600;}
.settings-hint{font-size:12px; color:var(--ink-soft); font-weight:400; margin-top:2px;}
.switch{position:relative; width:44px; height:25px; flex-shrink:0;}
.switch input{opacity:0;width:0;height:0;}
.slider-toggle{position:absolute;inset:0;background:var(--surface-2);border:1px solid var(--border);border-radius:999px;transition:.15s;}
.slider-toggle:before{content:"";position:absolute;height:19px;width:19px;left:2px;top:2px;background:var(--surface);border-radius:50%;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.2);}
input:checked + .slider-toggle{background:var(--accent); border-color:var(--accent);}
input:checked + .slider-toggle:before{transform:translateX(19px); background:#fff;}
.select, .number-input{padding:8px 10px; border-radius:8px; border:1px solid var(--border); background:var(--surface); color:var(--ink); font-size:13.5px;}
.week-check-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:8px;}
@media (max-width:600px){.week-check-grid{grid-template-columns:repeat(2,1fr);}}
.week-check{display:flex;align-items:center;gap:6px;font-size:13px;padding:7px 9px;border:1px solid var(--border);border-radius:8px;}
 
.history-item{display:flex; justify-content:space-between; align-items:center; padding:14px 4px; border-bottom:1px solid var(--border); cursor:pointer; gap:10px;}
.history-item:hover{background:var(--surface-2);}
.history-item:last-child{border-bottom:none;}
.empty-state{text-align:center; padding:50px 20px; color:var(--ink-soft);}
.empty-state .big{font-size:38px; margin-bottom:10px;}
.banner{padding:13px 16px; border-radius:12px; background:var(--surface-2); border:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:20px; flex-wrap:wrap; font-size:13.5px;}
.small-note{font-size:12px; color:var(--ink-soft); margin-top:4px;}
</style>
</head>
<body>
 
<div class="overlay" id="overlay" onclick="closeSidebar()"></div>
<div id="app">
  <div class="topbar-mobile">
    <button class="hamburger" onclick="openSidebar()">☰</button>
    <div style="font-family:var(--font-serif);font-weight:700;font-size:15px;">NPTEL ML Mock Test</div>
  </div>
  <nav class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-badge">ML</div>
      <div class="brand-text">NPTEL ML<span>Mock Test Dashboard</span></div>
    </div>
    <div id="nav-list"></div>
    <div class="sidebar-foot">
      <div>Question bank: <b id="nav-qcount">0</b> questions across 8 weeks.</div>
      <div class="theme-row">
        <button class="theme-btn" id="theme-light" onclick="setTheme('light')">Light</button>
        <button class="theme-btn" id="theme-dark" onclick="setTheme('dark')">Dark</button>
        <button class="theme-btn" id="theme-auto" onclick="setTheme('auto')">Auto</button>
      </div>
    </div>
  </nav>
  <main class="main"><div class="container" id="view"></div></main>
</div>
 
<script>
/* =========================================================================
   DATA — question bank grounded strictly in the 8 uploaded NPTEL PDFs
   ========================================================================= */
const WEEK_TITLES = {
  1:"Introduction to Machine Learning",
  2:"Linear Regression & Decision Trees",
  3:"Instance-Based Learning & Feature Selection",
  4:"Probability & Bayesian Learning",
  5:"Logistic Regression & Support Vector Machines",
  6:"Neural Networks",
  7:"Computational Learning Theory & Ensembles",
  8:"Clustering"
};
 
const QUESTIONS = [
/* ---------------- WEEK 1 ---------------- */
{id:"w1-01",week:1,type:"mcq",diff:"Easy",q:"According to Mitchell's definition given in the course, a computer program is said to learn from experience E with respect to a task T and performance measure P if:",opts:["It is programmed with explicit rules for every possible input","Its performance at tasks in T, as measured by P, improves with experience E","It memorizes all training examples without generalizing","It uses only unsupervised algorithms"],ans:[1],exp:"Mitchell's classic definition states that a program learns if its performance at tasks in T, measured by P, improves with experience E.",src:"Week 1 · Introduction"},
{id:"w1-02",week:1,type:"mcq",diff:"Easy",q:"In supervised learning, the learner is given:",opts:["Only unlabeled inputs X","Input-output pairs (X, y) as pre-classified training examples","Rewards and punishments for actions","A fixed set of clustering rules"],ans:[1],exp:"Supervised learning uses pre-classified training examples: pairs of inputs X and outputs y.",src:"Week 1 · Types of Learning"},
{id:"w1-03",week:1,type:"mcq",diff:"Easy",q:"In reinforcement learning, the agent decides what to do based on:",opts:["Labeled training examples","Rewards and punishments received from the environment","Clustering of unlabeled inputs","A pre-specified decision tree"],ans:[1],exp:"Reinforcement learning determines actions to take based on rewards and punishments from the environment.",src:"Week 1 · Types of Learning"},
{id:"w1-04",week:1,type:"mcq",diff:"Easy",q:"When the target feature Y to be predicted is continuous, the supervised learning task is called:",opts:["Classification","Regression","Clustering","Reinforcement learning"],ans:[1],exp:"Regression is used when Y is continuous; classification is used when Y is discrete.",src:"Week 1 · Types of Learning"},
{id:"w1-05",week:1,type:"mcq",diff:"Easy",q:"When the target feature Y to be predicted is discrete, the supervised learning task is called:",opts:["Regression","Classification","Dimensionality reduction","Association rule mining"],ans:[1],exp:"Classification is used when Y is discrete; regression when Y is continuous.",src:"Week 1 · Types of Learning"},
{id:"w1-06",week:1,type:"mcq",diff:"Medium",q:"Preferring the simplest hypothesis consistent with the data (Occam's Razor) is an example of which type of inductive bias?",opts:["Restriction bias","Preference bias","Sampling bias","Confirmation bias"],ans:[1],exp:"Occam's Razor imposes an ordering (preference) on the hypothesis space rather than eliminating hypotheses outright — it is a preference bias.",src:"Week 1 · Inductive Bias"},
{id:"w1-07",week:1,type:"mcq",diff:"Medium",q:"A model that is too simple to capture the relevant characteristics of the data, with high training error and high test error, is said to be:",opts:["Overfitting","Underfitting","Well-regularized","Bayes optimal"],ans:[1],exp:"Underfitting is characterized by high bias, low variance, and high training and test error.",src:"Week 1 · Overfitting/Underfitting"},
{id:"w1-08",week:1,type:"mcq",diff:"Medium",q:"A model that fits irrelevant characteristics (noise) in the training data, showing low training error but high test error, is said to be:",opts:["Underfitting","Overfitting","Perfectly generalized","Restriction biased"],ans:[1],exp:"Overfitting shows low bias, high variance, low training error, and high test error.",src:"Week 1 · Overfitting/Underfitting"},
{id:"w1-09",week:1,type:"mcq",diff:"Medium",q:"In k-fold cross-validation, in each of the k rounds:",opts:["All the data is used for both training and testing simultaneously","1/k of the data is held out as a test set and the remaining examples are used for training","The model is trained only once on the full dataset","k different models are trained on entirely different problems"],ans:[1],exp:"K-fold cross-validation splits data into k subsets; each round holds out 1/k as test data and trains on the rest.",src:"Week 1 · Evaluation & Cross-validation"},
{id:"w1-10",week:1,type:"mcq",diff:"Medium",q:"According to the Inductive Learning Hypothesis, a hypothesis that approximates the target function well over a sufficiently large set of training examples will also:",opts:["Always achieve zero training error","Approximate the target function well over other unobserved examples","Become the most general hypothesis in H","Require re-training on every new example"],ans:[1],exp:"The Inductive Learning Hypothesis states that good approximation over enough training data generalizes to unobserved examples.",src:"Week 1 · Inductive Bias"},
{id:"w1-11",week:1,type:"mcq",diff:"Medium",q:"The hypothesis space H, as described in the course, is best defined as:",opts:["The set of all training examples collected","The set of all hypotheses that can, in principle, be output by a learning algorithm","The single correct target function f","A validation dataset used to tune parameters"],ans:[1],exp:"The hypothesis space is the set of all hypotheses a learning algorithm could, in principle, produce.",src:"Week 1 · Hypothesis Space"},
{id:"w1-12",week:1,type:"msq",diff:"Easy",q:"Which of the following are broad types of machine learning discussed in the course? (Select all that apply)",opts:["Supervised Learning","Unsupervised Learning","Reinforcement Learning","Quantum Learning"],ans:[0,1,2],exp:"The course describes Supervised, Unsupervised, Semi-supervised, and Reinforcement Learning; 'Quantum Learning' is not discussed.",src:"Week 1 · Types of Learning"},
{id:"w1-13",week:1,type:"msq",diff:"Medium",q:"Which of the following are given in the course as types/examples of inductive bias? (Select all that apply)",opts:["Minimum description length","Maximum margin (as used in SVM)","Occam's Razor","Maximum feature count"],ans:[0,1,2],exp:"The slides list Occam's razor, minimum description length, and maximum margin as examples of inductive bias.",src:"Week 1 · Inductive Bias"},
{id:"w1-14",week:1,type:"msq",diff:"Medium",q:"According to the course, generalization error can be decomposed into which of the following components?",opts:["Bias","Variance","Regularization strength","Learning rate"],ans:[0,1],exp:"The course describes bias and variance as the two components of generalization error.",src:"Week 1 · Overfitting/Underfitting"},
{id:"w1-15",week:1,type:"numeric",diff:"Medium",q:"A classifier evaluated on a test set produces the confusion matrix values TP=40, FP=10, FN=5, TN=45. Using Accuracy = (TP+TN)/(TP+FP+FN+TN), what is the accuracy (as a decimal, e.g. 0.85)?",ans:{v:0.85,tol:0.01},exp:"Accuracy = (40+45)/(40+10+5+45) = 85/100 = 0.85.",src:"Week 1 · Evaluation (Confusion Matrix)"},
{id:"w1-16",week:1,type:"numeric",diff:"Hard",q:"For the confusion matrix TP=50, FP=10, FN=20, TN=20, compute Precision = TP/(TP+FP). Give the answer as a decimal rounded to 2 places.",ans:{v:0.83,tol:0.02},exp:"Precision = 50/(50+10) = 50/60 ≈ 0.83.",src:"Week 1 · Evaluation (Confusion Matrix)"},
{id:"w1-17",week:1,type:"numeric",diff:"Hard",q:"If there are N = 3 binary input features, the number of possible Boolean functions over these features is 2^(2^N). What is this value for N = 3?",ans:{v:256,tol:0},exp:"2^(2^3) = 2^8 = 256, as stated in the Hypothesis Spaces discussion.",src:"Week 1 · Hypothesis Space"},
 
/* ---------------- WEEK 2 ---------------- */
{id:"w2-01",week:2,type:"mcq",diff:"Easy",q:"In the simple linear regression equation Y = β0 + β1X + ε, the term β0 represents:",opts:["The slope of the regression line","The intercept — the average value of Y when X = 0","The random error term","The correlation coefficient"],ans:[1],exp:"β0 is the population Y-intercept — the average value of Y when all X's are zero.",src:"Week 2 · Linear Regression"},
{id:"w2-02",week:2,type:"mcq",diff:"Easy",q:"The method of least squares chooses the regression line that:",opts:["Maximizes the sum of squared residuals","Minimizes the sum of squared residuals between the data points and the line","Minimizes the number of data points used","Maximizes the intercept term"],ans:[1],exp:"Least squares finds the line minimizing the sum of squared vertical distances (residuals).",src:"Week 2 · Linear Regression"},
{id:"w2-03",week:2,type:"mcq",diff:"Medium",q:"The LMS (delta rule) update for a single training example (x,y), as derived in the course, is given by:",opts:["βj = βj − α(y − h(x))xj","βj = βj + α(y − h(x))xj","βj = βj + α·h(x)","βj = βj − α·y"],ans:[1],exp:"The slides derive βj = βj + α(y(i) − h(x(i)))xj(i) as the LMS update rule.",src:"Week 2 · Linear Regression"},
{id:"w2-04",week:2,type:"mcq",diff:"Easy",q:"Batch gradient descent, as described in the course, updates parameters by:",opts:["Looking at only one randomly chosen example per step","Looking at every training example on each step before updating","Never using the training data","Updating parameters only once at the very end"],ans:[1],exp:"Batch gradient descent sums the error gradient over every example before each update.",src:"Week 2 · Linear Regression"},
{id:"w2-05",week:2,type:"mcq",diff:"Easy",q:"Stochastic gradient descent, as described in the course, updates the parameters:",opts:["Only after seeing the entire training set once","Whenever a training point is encountered, using the gradient from that example alone","Using a closed-form matrix inversion only","Only for classification tasks, never regression"],ans:[1],exp:"Stochastic gradient descent updates parameters using the gradient from each individual training example as it is encountered.",src:"Week 2 · Linear Regression"},
{id:"w2-06",week:2,type:"mcq",diff:"Easy",q:"In a decision tree, a leaf node:",opts:["Specifies a test on some attribute","Indicates the classification (or prediction) of an example","Is always the root of the tree","Has multiple children nodes"],ans:[1],exp:"A leaf node indicates the classification of an example; decision nodes specify attribute tests.",src:"Week 2 · Decision Trees"},
{id:"w2-07",week:2,type:"mcq",diff:"Easy",q:"The entropy of a sample S, as discussed in the course, is 0 when:",opts:["The sample has equal numbers of positive and negative examples","The outcome in the sample is completely certain (pure)","The sample is empty","The sample has maximum uncertainty"],ans:[1],exp:"Entropy is 0 when the outcome is certain, and maximum when there is no knowledge / any outcome is equally possible.",src:"Week 2 · Decision Trees (Entropy)"},
{id:"w2-08",week:2,type:"mcq",diff:"Medium",q:"In the ID3 worked example from the course (the PlayTennis dataset), which attribute has the highest information gain and is chosen for the root split?",opts:["Humidity","Wind","Outlook","Temperature"],ans:[2],exp:"The slides compute Gain(S,Outlook)=0.247, which is higher than Humidity (0.151), Wind (0.048), and Temperature (0.029).",src:"Week 2 · ID3 Algorithm"},
{id:"w2-09",week:2,type:"mcq",diff:"Easy",q:"The GINI index, as introduced in the course, is used as a measure of:",opts:["Regression accuracy","Node impurity for decision tree splitting","Neural network convergence","Kernel similarity"],ans:[1],exp:"GINI index measures node impurity, used to decide splits in decision trees.",src:"Week 2 · Decision Trees"},
{id:"w2-10",week:2,type:"msq",diff:"Medium",q:"Which of the following are described in the course as strategies to avoid overfitting in decision trees? (Select all that apply)",opts:["Pre-pruning (stop growing early)","Post-pruning (grow full tree, then remove nodes)","Always growing the tree to maximum depth","Reduced-error pruning using a validation set"],ans:[0,1,3],exp:"The course describes pre-pruning, post-pruning, and cross-validation-based reduced-error pruning; always growing to max depth increases overfitting.",src:"Week 2 · Overfitting"},
{id:"w2-11",week:2,type:"mcq",diff:"Easy",q:"L2-regularization in linear regression, as named in the course, is also known as:",opts:["Lasso regression","Ridge regression","Logistic regression","Bagging"],ans:[1],exp:"L2-regularization is called Ridge regression; L1-regularization is Lasso.",src:"Week 2 · Regularization"},
{id:"w2-12",week:2,type:"mcq",diff:"Medium",q:"A hypothesis h is said to overfit the training data if there exists another hypothesis h' such that:",opts:["h has larger error than h' on both training and test data","h has smaller error than h' on training data, but larger error than h' on test data","h and h' always perform identically","h has smaller error than h' on test data only"],ans:[1],exp:"This is the course's exact definition of overfitting relative to another hypothesis h'.",src:"Week 2 · Overfitting"},
{id:"w2-13",week:2,type:"mcq",diff:"Hard",q:"According to the 'Triple Trade-Off' discussed in the course, as the complexity of hypothesis space H increases (training set size fixed), the generalization error E on new data typically:",opts:["Keeps decreasing indefinitely","First decreases, then increases (overfitting)","Remains constant throughout","Increases then decreases"],ans:[1],exp:"The Triple Trade-Off states E first decreases then increases as hypothesis complexity increases.",src:"Week 2 · Overfitting"},
{id:"w2-14",week:2,type:"numeric",diff:"Medium",q:"If a training sample S has equal numbers of positive and negative examples (p+ = p− = 0.5), what is Entropy(S)? (Entropy(S) = −p+log2 p+ − p−log2 p−)",ans:{v:1,tol:0.02},exp:"With p+ = p− = 0.5, Entropy(S) = −0.5log2(0.5) − 0.5log2(0.5) = 1, the maximum possible entropy.",src:"Week 2 · Decision Trees (Entropy)"},
{id:"w2-15",week:2,type:"numeric",diff:"Hard",q:"In the course's worked example with S=[9+,5-] (Entropy(S)=0.940), splitting on Outlook gives Gain(S,Outlook) = 0.940 − (5/14)(0.971) − (4/14)(0.0) − (5/14)(0.971). What is this information gain, as stated in the slides (to 3 decimal places)?",ans:{v:0.247,tol:0.01},exp:"The slides state Gain(S,Outlook) = 0.247.",src:"Week 2 · ID3 Algorithm"},
{id:"w2-16",week:2,type:"numeric",diff:"Hard",q:"Splitting S=[9+,5-] (Entropy=0.940) on Humidity gives 7 examples with entropy 0.985 and 7 examples with entropy 0.592. Using Gain(S,Humidity)=0.940−(7/14)(0.985)−(7/14)(0.592), what is the information gain (to 3 decimal places)?",ans:{v:0.151,tol:0.01},exp:"The slides state Gain(S,Humidity) = 0.151, greater than Gain(S,Wind) = 0.048.",src:"Week 2 · ID3 Algorithm"},
 
/* ---------------- WEEK 3 ---------------- */
{id:"w3-01",week:3,type:"mcq",diff:"Easy",q:"In basic k-nearest neighbor classification, the predicted class for a test example is:",opts:["The class of the single farthest training example","The most frequent class among the k closest training examples","Always the majority class in the entire training set","Determined by a decision tree built from the k neighbors"],ans:[1],exp:"Basic k-NN predicts the most frequent class among the k nearest training examples.",src:"Week 3 · Instance-Based Learning"},
{id:"w3-02",week:3,type:"mcq",diff:"Easy",q:"Choosing a larger value of k in k-NN generally:",opts:["Makes the classifier more sensitive to noise","Makes the classifier less sensitive to noise, particularly class noise","Has no effect on noise sensitivity","Always reduces accuracy"],ans:[1],exp:"Larger k is less sensitive to noise but may lose fine structure; smaller k captures fine structure but is noisier.",src:"Week 3 · Instance-Based Learning"},
{id:"w3-03",week:3,type:"mcq",diff:"Medium",q:"As the size of the training set approaches infinity and k grows large, k-NN approaches the performance of:",opts:["A linear regression model","The Bayes optimal classifier","A single decision tree","Random guessing"],ans:[1],exp:"The course states that as training data and k both grow large, k-NN becomes Bayes optimal.",src:"Week 3 · Instance-Based Learning"},
{id:"w3-04",week:3,type:"mcq",diff:"Medium",q:"The 'curse of dimensionality' in the context of k-NN refers to the phenomenon that:",opts:["Distances between points become smaller and more distinguishable as dimensions increase","As the number of dimensions increases, distances between points become larger and more uniform, reducing usefulness","Adding more dimensions always improves classification accuracy","k-NN cannot be applied to more than 2 dimensions"],ans:[1],exp:"As dimensionality increases, distances become larger and more uniform, making nearest-neighbor comparisons less meaningful.",src:"Week 3 · Curse of Dimensionality"},
{id:"w3-05",week:3,type:"mcq",diff:"Medium",q:"Feature Selection differs from Feature Extraction in that Feature Selection:",opts:["Projects original features into a new, transformed lower-dimensional space","Chooses a subset of the original features while ignoring the rest","Always increases the number of features","Requires no labeled data at all"],ans:[1],exp:"Feature Selection picks a subset of the original features F; Feature Extraction projects to new dimensions.",src:"Week 3 · Feature Selection"},
{id:"w3-06",week:3,type:"mcq",diff:"Easy",q:"Forward search, as a subset-selection strategy for feature selection, starts from:",opts:["The full set of all features","An empty set of features, adding features one at a time","A randomly chosen subset of features","The feature with the highest variance only"],ans:[1],exp:"Forward search starts from the empty set and adds the feature that most improves validation performance at each step.",src:"Week 3 · Feature Selection"},
{id:"w3-07",week:3,type:"mcq",diff:"Easy",q:"The Pearson correlation coefficient, used for univariate feature selection, lies in the range:",opts:["0 to 1","−1 to +1","−∞ to +∞","0 to 100"],ans:[1],exp:"Pearson correlation r ranges from −1 (perfect negative correlation) to +1 (perfect positive correlation).",src:"Week 3 · Feature Selection"},
{id:"w3-08",week:3,type:"mcq",diff:"Medium",q:"PCA (Principal Component Analysis) chooses projection directions that:",opts:["Minimize the total variance of the projected data","Maximize the total variance of the data while being orthogonal to each other","Always align with the original feature axes","Maximize between-class distance only"],ans:[1],exp:"PCA selects orthogonal directions that maximize total variance in the data.",src:"Week 3 · Feature Extraction (PCA)"},
{id:"w3-09",week:3,type:"mcq",diff:"Medium",q:"Unlike PCA, Linear Discriminant Analysis (LDA) explicitly uses which additional information when choosing a projection?",opts:["Class label information (between-class and within-class distances)","The covariance of noise only","The number of samples in the test set","Kernel functions"],ans:[0],exp:"LDA maximizes between-class distance and minimizes within-class distance, using class labels — information PCA does not use.",src:"Week 3 · LDA"},
{id:"w3-10",week:3,type:"mcq",diff:"Medium",q:"Item-based collaborative filtering was introduced mainly to address which limitation of user-based k-NN collaborative filtering?",opts:["Lack of accuracy on sparse data","Lack of scalability due to real-time comparison with all user records","Inability to handle explicit ratings","Inability to use the Pearson correlation coefficient"],ans:[1],exp:"User-based CF requires comparing the target user to all other users in real time, which does not scale; item-based CF avoids this.",src:"Week 3 · Collaborative Filtering"},
{id:"w3-11",week:3,type:"mcq",diff:"Easy",q:"In user-based collaborative filtering, the similarity between two users' rating profiles is typically computed using:",opts:["The Pearson correlation coefficient","The GINI index","Information gain","The sigmoid function"],ans:[0],exp:"The course uses Pearson's correlation coefficient to compute similarity between users' rating vectors.",src:"Week 3 · Collaborative Filtering"},
{id:"w3-12",week:3,type:"mcq",diff:"Easy",q:"In weighted Euclidean distance for k-NN, assigning a weight of zero to an attribute means that attribute:",opts:["Is the most important attribute","Does not matter / has no effect on the distance","Must be normalized separately","Is treated as categorical"],ans:[1],exp:"Zero weight means the attribute contributes nothing to the distance calculation.",src:"Week 3 · Instance-Based Learning"},
{id:"w3-13",week:3,type:"mcq",diff:"Medium",q:"In distance-weighted k-NN, the weight given to a neighbor is typically:",opts:["Directly proportional to its distance from the test point","Inversely related to its distance from the test point (closer neighbors weigh more)","Equal for all neighbors regardless of distance","Based only on the neighbor's class label"],ans:[1],exp:"Distance-weighted k-NN gives more weight to closer neighbors, e.g. wk = 1/Dist(ck, ctest).",src:"Week 3 · Instance-Based Learning"},
{id:"w3-14",week:3,type:"msq",diff:"Medium",q:"Which of the following are listed in the course as advantages of memory-based (instance-based) learning methods? (Select all that apply)",opts:["Lazy learning — no work needed until a prediction is required","Very efficient cross-validation","Intelligible/explainable to users","Performs best in very high-dimensional spaces"],ans:[0,1,2],exp:"The slides list lazy learning, efficient cross-validation, and intelligibility as advantages; high dimensionality is actually a weakness.",src:"Week 3 · Instance-Based Learning"},
{id:"w3-15",week:3,type:"numeric",diff:"Medium",q:"According to the course, memory-based (instance-based) learning methods often work best with how many or fewer feature dimensions?",ans:{v:25,tol:0},exp:"The slides state these methods often work best with 25 or fewer dimensions.",src:"Week 3 · Instance-Based Learning (Weaknesses)"},
{id:"w3-16",week:3,type:"mcq",diff:"Hard",q:"Which of these best distinguishes Mahalanobis distance from plain Euclidean distance, as discussed in the course?",opts:["Mahalanobis distance accounts for covariance between features (Σ⁻¹), while Euclidean distance assumes independent, equally scaled features","Euclidean distance always outperforms Mahalanobis distance","Mahalanobis distance cannot be used for classification","They are mathematically identical"],ans:[0],exp:"Mahalanobis distance uses the inverse covariance matrix to account for correlations and different scales among features.",src:"Week 3 · Distance Measures"},
 
/* ---------------- WEEK 4 ---------------- */
{id:"w4-01",week:4,type:"mcq",diff:"Easy",q:"Bayes' Theorem, as presented in the course, states that P(h|D) equals:",opts:["P(D)·P(h)","P(D|h)·P(h) / P(D)","P(h)/P(D|h)","P(D) − P(h)"],ans:[1],exp:"Bayes' rule: P(h|D) = P(D|h)P(h)/P(D).",src:"Week 4 · Bayesian Learning"},
{id:"w4-02",week:4,type:"mcq",diff:"Medium",q:"The Maximum Likelihood (ML) hypothesis hML = argmax P(D|h) is obtained from the MAP hypothesis when:",opts:["P(D) is assumed to be zero","Every hypothesis in H is assumed equally probable a priori","The training data D is empty","H contains only one hypothesis"],ans:[1],exp:"If every hypothesis is equally likely a priori, hMAP reduces to hML, which only considers the likelihood P(D|h).",src:"Week 4 · Bayesian Learning"},
{id:"w4-03",week:4,type:"mcq",diff:"Easy",q:"The key simplifying assumption made by the Naïve Bayes classifier is that:",opts:["All features are perfectly correlated","All input features are conditionally independent given the class label","There is only one possible class","The prior probability of every class is equal"],ans:[1],exp:"Naïve Bayes assumes conditional independence of all features given the class.",src:"Week 4 · Naïve Bayes"},
{id:"w4-04",week:4,type:"mcq",diff:"Medium",q:"The Bayes Optimal Classifier makes its prediction by combining the votes of all hypotheses in H, each weighted by:",opts:["The hypothesis's training accuracy only","P(vj|hi)·P(hi|D), summed over all hypotheses","A fixed uniform weight of 1/|H|","The number of features used by that hypothesis"],ans:[1],exp:"Bayes optimal classification computes argmax over vj of Σ P(vj|hi)P(hi|D) across all hypotheses hi.",src:"Week 4 · Bayes Optimal Classifier"},
{id:"w4-05",week:4,type:"mcq",diff:"Medium",q:"The Gibbs Algorithm, as an alternative to the (computationally expensive) Bayes Optimal Classifier, works by:",opts:["Averaging the predictions of all hypotheses equally","Randomly choosing a single hypothesis according to the posterior P(h|D) and using it to classify","Selecting the hypothesis with the lowest prior probability","Ignoring the posterior distribution entirely"],ans:[1],exp:"Gibbs Algorithm picks one hypothesis at random according to P(h|D) and uses it for classification.",src:"Week 4 · Bayes Optimal Classifier"},
{id:"w4-06",week:4,type:"mcq",diff:"Medium",q:"In a Bayesian Network, the lack of a direct arc between two variable nodes denotes:",opts:["That the two variables are perfectly correlated","A conditional independence relation between them","That one variable causes the other directly","That both variables are unobservable"],ans:[1],exp:"An absent arc in a Bayesian Network denotes conditional independence between the corresponding variables.",src:"Week 4 · Bayesian Networks"},
{id:"w4-07",week:4,type:"mcq",diff:"Medium",q:"In a Hidden Markov Model (HMM), the observation Yt is assumed to be:",opts:["Independent of the hidden state St","Conditionally independent of all other variables, given the current hidden state St","Directly equal to the hidden state St","Dependent on all future hidden states"],ans:[1],exp:"HMM assumes Yt is conditionally independent of everything else given St, and the hidden state sequence is Markov.",src:"Week 4 · Bayesian Networks (HMM)"},
{id:"w4-08",week:4,type:"mcq",diff:"Easy",q:"A random variable is best described as a function that:",opts:["Maps outcomes of the sample space to real scalar values","Is always discrete","Always follows a normal distribution","Cannot be used with conditional probability"],ans:[0],exp:"A random variable is a function defined on the sample space, mapping outcomes to real scalar values.",src:"Week 4 · Probability Basics"},
{id:"w4-09",week:4,type:"mcq",diff:"Easy",q:"Two random variables X and Y are said to be independent if and only if:",opts:["P(X=x | Y=y) = 1 for all x, y","P(X=x, Y=y) = P(X=x)·P(Y=y)","P(X=x) = P(Y=y) always","X and Y have the same distribution"],ans:[1],exp:"Independence means the joint probability factors as the product of the marginals.",src:"Week 4 · Probability Basics"},
{id:"w4-10",week:4,type:"mcq",diff:"Easy",q:"For a continuous random variable, the probability that X lies between two values a and b is obtained by:",opts:["Reading off the probability mass function directly","Integrating the probability density function (pdf) between a and b","Summing the pdf values at a and b","Taking the derivative of the pdf at those points"],ans:[1],exp:"For continuous RVs, probability over an interval is the integral of the pdf over that interval.",src:"Week 4 · Probability Basics"},
{id:"w4-11",week:4,type:"mcq",diff:"Medium",q:"The course notes that Naïve Bayes is used successfully in many applications despite features rarely being truly conditionally independent, because:",opts:["It always computes the exact true probability regardless","It often produces the right classification decision even when the estimated probabilities are not exactly correct","Conditional independence is guaranteed for text data","It ignores the class label"],ans:[1],exp:"The course states Naïve Bayes often gives the right classification even when the probability estimates are not exactly right.",src:"Week 4 · Naïve Bayes"},
{id:"w4-12",week:4,type:"msq",diff:"Medium",q:"For Gaussian Naïve Bayes with continuous features, the course notes that the variance of the class-conditional Gaussian can be assumed to be:",opts:["Independent of the class label Y","Independent of the feature Xi","Independent of both Y and Xi","Always exactly equal to 1"],ans:[0,1,2],exp:"The slides state variance may be assumed independent of Y, independent of Xi, or both, as simplifying assumptions.",src:"Week 4 · Gaussian Naïve Bayes"},
{id:"w4-13",week:4,type:"numeric",diff:"Hard",q:"In the course's cancer-diagnosis example, P(cancer)=0.008 and P(positive test | cancer)=0.98. What is P(positive test | cancer) × P(cancer)? (to 4 decimal places, e.g. 0.0078)",ans:{v:0.00784,tol:0.0003},exp:"0.98 × 0.008 = 0.00784.",src:"Week 4 · Bayesian Learning Example"},
{id:"w4-14",week:4,type:"numeric",diff:"Medium",q:"In the PlayTennis Naïve Bayes example from the course, P(Play=Yes) = 9/14. Express this as a decimal rounded to two decimal places.",ans:{v:0.64,tol:0.01},exp:"9/14 ≈ 0.64.",src:"Week 4 · Naïve Bayes Example"},
{id:"w4-15",week:4,type:"mcq",diff:"Hard",q:"According to the result attributed to Haussler et al. (1994) discussed in the course, the expected error of the Gibbs Algorithm (relative to the Bayes Optimal Classifier) is:",opts:["Always exactly equal to the Bayes Optimal error","At most twice the expected error of the Bayes Optimal Classifier","Always lower than the Bayes Optimal error","Unbounded and unrelated to the Bayes Optimal error"],ans:[1],exp:"The slides state E[error(Gibbs)] ≤ 2·E[error(Bayes Optimal)].",src:"Week 4 · Bayes Optimal Classifier"},
{id:"w4-16",week:4,type:"mcq",diff:"Medium",q:"Learning a Bayesian Network when the structure is known and all variables are fully observed in the training data mainly involves:",opts:["Estimating the conditional probability tables from the data","Running a gradient-ascent procedure similar to a neural network's hidden units","Performing heuristic structure search","No learning is required in this case"],ans:[0],exp:"When structure is known and all variables observed, learning reduces to estimating the conditional probabilities from data.",src:"Week 4 · Bayesian Networks"},
 
/* ---------------- WEEK 5 ---------------- */
{id:"w5-01",week:5,type:"mcq",diff:"Easy",q:"Logistic regression models the conditional probability P(y=1|x) using:",opts:["A linear function of x directly","The sigmoid/logistic function g(z) = 1/(1+e^-z) applied to βᵀx","A decision tree","The Euclidean distance to training points"],ans:[1],exp:"Logistic regression uses hβ(x) = g(βᵀx) where g is the sigmoid function.",src:"Week 5 · Logistic Regression"},
{id:"w5-02",week:5,type:"mcq",diff:"Medium",q:"The derivative of the sigmoid function g(z) = 1/(1+e^-z) is given by:",opts:["g(z)","g(z)·(1 − g(z))","1 − g(z)²","g(z)²"],ans:[1],exp:"The course derives g'(z) = g(z)(1 − g(z)), a key sigmoid property.",src:"Week 5 · Logistic Regression"},
{id:"w5-03",week:5,type:"mcq",diff:"Easy",q:"In logistic regression, we predict y=1 for an input x when:",opts:["hβ(x) < 0.5","hβ(x) ≥ 0.5, equivalently βᵀx ≥ 0","x contains only positive values","βᵀx is undefined"],ans:[1],exp:"We predict 1 iff hβ(x) ≥ 0.5, which is equivalent to βᵀx ≥ 0.",src:"Week 5 · Logistic Regression"},
{id:"w5-04",week:5,type:"mcq",diff:"Medium",q:"The stochastic gradient ascent update rule for logistic regression parameters, as derived in the course, is:",opts:["βj = βj + α(y − hβ(x))xj","βj = βj − α·y·xj","βj = βj + α·hβ(x)","βj = βj − α(y − hβ(x))"],ans:[0],exp:"The course derives βj = βj + α(y(i) − hβ(x(i)))xj(i).",src:"Week 5 · Logistic Regression"},
{id:"w5-05",week:5,type:"mcq",diff:"Easy",q:"The Support Vector Machine finds the separating hyperplane that:",opts:["Minimizes the number of support vectors","Maximizes the minimum margin between the hyperplane and the closest training points","Always passes through the origin","Minimizes the number of features used"],ans:[1],exp:"SVM finds the maximum-margin separator, maximizing the minimum distance to the closest points.",src:"Week 5 · SVM"},
{id:"w5-06",week:5,type:"mcq",diff:"Easy",q:"Support vectors are defined as the training points that:",opts:["Have zero Lagrange multipliers (αi = 0)","Have non-zero Lagrange multipliers and determine the maximum-margin separator","Are always misclassified","Lie farthest from the decision boundary"],ans:[1],exp:"Support vectors are the points with non-zero αi, which determine the maximum-margin hyperplane.",src:"Week 5 · Support Vectors"},
{id:"w5-07",week:5,type:"mcq",diff:"Medium",q:"In the soft-margin SVM formulation (minimize w·w + C·Σξk), the parameter C controls:",opts:["The number of support vectors directly","The trade-off between maximizing the margin and minimizing training errors (slack)","The kernel function used","The learning rate of gradient descent"],ans:[1],exp:"C controls the relative importance of maximizing the margin versus fitting the training data (controls overfitting).",src:"Week 5 · Maximum Margin with Noise"},
{id:"w5-08",week:5,type:"mcq",diff:"Hard",q:"In the SVM dual optimization problem, the constraint Σ αiyi = 0 arises from:",opts:["Setting the derivative of the Lagrangian with respect to b to zero","Setting the derivative of the Lagrangian with respect to w to zero","The requirement that all αi be non-negative","The choice of kernel function"],ans:[0],exp:"∂Lp/∂b = 0 yields Σαiyi = 0 in the dual formulation.",src:"Week 5 · SVM Dual"},
{id:"w5-09",week:5,type:"mcq",diff:"Easy",q:"The 'kernel trick' allows an SVM to:",opts:["Avoid computing dot products altogether","Compute dot products in a high-dimensional feature space without explicitly computing the mapping φ(x)","Reduce the number of training examples needed","Guarantee linear separability of any dataset without any transformation"],ans:[1],exp:"The kernel trick lets us compute φ(xa)·φ(xb) via K(xa,xb) without explicitly forming φ(x).",src:"Week 5 · Kernel Trick"},
{id:"w5-10",week:5,type:"msq",diff:"Medium",q:"Which of the following are listed in the course as commonly-used kernel functions? (Select all that apply)",opts:["Linear kernel","Polynomial kernel","Gaussian (RBF) kernel","Sigmoid kernel"],ans:[0,1,2,3],exp:"The slides list linear, polynomial, Gaussian (RBF), and sigmoid kernels as commonly used kernel functions.",src:"Week 5 · Kernel Functions"},
{id:"w5-11",week:5,type:"mcq",diff:"Medium",q:"Mercer's condition is important because it guarantees that a given kernel function:",opts:["Always produces a linear decision boundary","Corresponds to a dot product of feature vectors in some (possibly high-dimensional) space","Runs in constant time regardless of data size","Cannot be used with the SMO algorithm"],ans:[1],exp:"Mercer's condition ensures a positive semi-definite kernel can be expressed as a dot product in some feature space.",src:"Week 5 · Kernel Functions"},
{id:"w5-12",week:5,type:"mcq",diff:"Medium",q:"The SMO (Sequential Minimal Optimization) algorithm updates the Lagrange multipliers by:",opts:["Updating all αi simultaneously in every iteration","Updating at least two αi at a time, to keep the constraint Σαiyi = 0 satisfied","Updating exactly one αi at a time with no constraints","Never updating αi, only b"],opts_note:"",ans:[1],exp:"Because Σαiyi = 0 must hold, SMO updates at least two αi together at each step.",src:"Week 5 · SMO Algorithm"},
{id:"w5-13",week:5,type:"mcq",diff:"Easy",q:"For a multi-class classification problem with N classes using the one-vs-rest SVM approach described in the course, how many SVMs need to be trained?",opts:["1","N","N²","N−1"],ans:[1],exp:"The course describes training N SVMs, one per class versus the rest.",src:"Week 5 · Multi-class Classification"},

/* =========================================================================
   STORAGE HELPERS
   ========================================================================= */
const LS = {
  STATS:"nptel_qstats_v1", HISTORY:"nptel_history_v1", SETTINGS:"nptel_settings_v1",
  CURRENT:"nptel_current_v1", RECENT:"nptel_recent_v1", THEME:"nptel_theme_v1"
};
const FULL_MOCK_TIMER_MINUTES = 180;
const FULL_MOCK_TIMER_SECONDS = 3 * 60 * 60;
const FULL_MOCK_TIMER_LABEL = "3 hours (03:00:00)";
function lsGet(key, fallback){
  try{ const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
  catch(e){ return fallback; }
}
function lsSet(key, val){
  try{ localStorage.setItem(key, JSON.stringify(val)); return true; }
  catch(e){ console.error("Storage error", e); return false; }
}
function getStats(){ return lsGet(LS.STATS, {}); }
function saveStats(s){ lsSet(LS.STATS, s); }
function getHistory(){ return lsGet(LS.HISTORY, []); }
function saveHistory(h){ lsSet(LS.HISTORY, h); }
function getSettings(){
  const settings = lsGet(LS.SETTINGS, {
    numQuestions:40, marksPerQ:2.5, timerMinutes:FULL_MOCK_TIMER_MINUTES, timerEnabled:true, immediateFeedback:true,
    distMcq:60, distMsq:25, distNum:15, difficulty:"Mixed", weeks:[1,2,3,4,5,6,7,8]
  });
  // Upgrade saved preferences from earlier versions and keep full mocks fixed at three hours.
  if(settings.timerMinutes !== FULL_MOCK_TIMER_MINUTES){
    settings.timerMinutes = FULL_MOCK_TIMER_MINUTES;
    lsSet(LS.SETTINGS, settings);
  }
  return settings;
}
function saveSettings(s){ lsSet(LS.SETTINGS, s); }
function getCurrent(){ return lsGet(LS.CURRENT, null); }
function saveCurrent(c){ lsSet(LS.CURRENT, c); }
function clearCurrent(){ try{ localStorage.removeItem(LS.CURRENT); }catch(e){} }
function getRecent(){ return lsGet(LS.RECENT, []); }
function updateRecent(qids){
  let r = getRecent();
  r = qids.concat(r);
  if(r.length>160) r = r.slice(0,160);
  lsSet(LS.RECENT, r);
}
 
/* =========================================================================
   UTILITIES
   ========================================================================= */
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
function byId(qid){ return QUESTIONS.find(q=>q.id===qid); }
function fmt1(n){ return (Math.round(n*10)/10).toString(); }
function fmtPct(n){ return (Math.round(n*10)/10)+"%"; }
function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];
  });
}
function fmtTime(sec){
  sec = Math.max(0, Math.round(sec));
  const h = Math.floor(sec/3600), m = Math.floor((sec%3600)/60), s = sec%60;
  return (h<10?"0":"")+h+":"+(m<10?"0":"")+m+":"+(s<10?"0":"")+s;
}
function fmtTimeLong(sec){
  sec = Math.max(0, Math.round(sec));
  const m = Math.floor(sec/60), s = sec%60;
  return m+" min "+s+" sec";
}
function nowISO(){ return new Date().toISOString(); }
function fmtDate(iso){
  const d = new Date(iso);
  return d.toLocaleDateString(undefined,{day:"2-digit",month:"short",year:"numeric"})+" · "+d.toLocaleTimeString(undefined,{hour:"2-digit",minute:"2-digit"});
}
 
/* =========================================================================
   TEST GENERATION ENGINE
   ========================================================================= */
function computeWeekCounts(total, weeks){
  const n = weeks.length;
  let base = Math.floor(total/n);
  let rem = total - base*n;
  let counts = new Array(n).fill(base);
  const order = shuffle([...Array(n).keys()]);
  for(let i=0;i<rem;i++) counts[order[i%order.length]]++;
  for(let t=0;t<n;t++){
    if(Math.random()<0.4){
      const a = Math.floor(Math.random()*n), b = Math.floor(Math.random()*n);
      if(a!==b && counts[a]>1){ counts[a]--; counts[b]++; }
    }
  }
  return counts;
}
 
function makeInstance(q){
  let options=null, correctIdx=null, numAns=null;
  if(q.type==="mcq" || q.type==="msq"){
    const order = shuffle(q.opts.map((_,i)=>i));
    options = order.map(i=>q.opts[i]);
    correctIdx = [];
    order.forEach((origIdx,newIdx)=>{ if(q.ans.includes(origIdx)) correctIdx.push(newIdx); });
  } else {
    numAns = q.ans;
  }
  return {qid:q.id, week:q.week, type:q.type, diff:q.diff, question:q.q, src:q.src, exp:q.exp, options, correctIdx, numAns};
}
 
function buildTest(opts){
  // opts: {total, weeks, difficulty, distMcq, distMsq, distNum, typeFilter, sourcePool}
  let basePool = opts.sourcePool || QUESTIONS.filter(q=>
    opts.weeks.includes(q.week) && (opts.difficulty==="Mixed" || q.diff===opts.difficulty)
  );
  if(opts.typeFilter) basePool = basePool.filter(q=>q.type===opts.typeFilter);
  if(basePool.length===0) return [];
  const total = Math.min(opts.total, basePool.length);
  const recent = getRecent();
 
  let typeSlots;
  if(opts.typeFilter){
    typeSlots = new Array(total).fill(opts.typeFilter);
  } else {
    let nMcq = Math.round(total*opts.distMcq/100);
    let nMsq = Math.round(total*opts.distMsq/100);
    let nNum = total - nMcq - nMsq;
    if(nNum<0){ nNum=0; nMsq = Math.max(0,total-nMcq); }
    typeSlots = shuffle([...Array(nMcq).fill("mcq"), ...Array(nMsq).fill("msq"), ...Array(nNum).fill("numeric")]);
    while(typeSlots.length<total) typeSlots.push("mcq");
    typeSlots = typeSlots.slice(0,total);
  }
 
  const weeksPresent = [...new Set(basePool.map(q=>q.week))].sort((a,b)=>a-b);
  const weekCountsArr = computeWeekCounts(total, weeksPresent);
  let weekSlots = [];
  weeksPresent.forEach((w,i)=>{ for(let k=0;k<weekCountsArr[i];k++) weekSlots.push(w); });
  weekSlots = shuffle(weekSlots);
  while(weekSlots.length<total) weekSlots.push(weeksPresent[Math.floor(Math.random()*weeksPresent.length)]);
  weekSlots = weekSlots.slice(0,total);
 
  const used = new Set();
  const picks = [];
  for(let i=0;i<total;i++){
    const wantWeek = weekSlots[i], wantType = typeSlots[i];
    let cands = basePool.filter(q=>!used.has(q.id) && q.week===wantWeek && q.type===wantType);
    if(cands.length===0) cands = basePool.filter(q=>!used.has(q.id) && q.week===wantWeek);
    if(cands.length===0) cands = basePool.filter(q=>!used.has(q.id) && q.type===wantType);
    if(cands.length===0) cands = basePool.filter(q=>!used.has(q.id));
    if(cands.length===0) break;
    let preferred = cands.filter(q=>!recent.includes(q.id));
    let pool2 = preferred.length ? preferred : cands;
    const choice = pool2[Math.floor(Math.random()*pool2.length)];
    used.add(choice.id);
    picks.push(choice);
  }
  const finalOrder = shuffle(picks);
  const instances = finalOrder.map(makeInstance);
  updateRecent(instances.map(i=>i.qid));
  return instances;
}
 
function startTest(mode, params){
  params = params || {};
  const settings = getSettings();
  let instances = [];
  let marksPerQ = settings.marksPerQ;
  let timerEnabled = settings.timerEnabled;
 
  if(mode==="full"){
    instances = buildTest({total:settings.numQuestions, weeks:settings.weeks, difficulty:settings.difficulty,
      distMcq:settings.distMcq, distMsq:settings.distMsq, distNum:settings.distNum});
  } else if(mode==="quick"){
    instances = buildTest({total:10, weeks:settings.weeks, difficulty:settings.difficulty,
      distMcq:settings.distMcq, distMsq:settings.distMsq, distNum:settings.distNum});
    timerEnabled = false;
  } else if(mode==="week"){
    instances = buildTest({total:params.count||15, weeks:params.weeks, difficulty:settings.difficulty,
      distMcq:settings.distMcq, distMsq:settings.distMsq, distNum:settings.distNum});
    timerEnabled = false;
  } else if(mode==="numeric"){
    instances = buildTest({total:params.count||12, weeks:settings.weeks, difficulty:"Mixed", typeFilter:"numeric",
      distMcq:0, distMsq:0, distNum:100});
    timerEnabled = false;
  } else if(mode==="msq"){
    instances = buildTest({total:params.count||12, weeks:settings.weeks, difficulty:"Mixed", typeFilter:"msq",
      distMcq:0, distMsq:100, distNum:0});
    timerEnabled = false;
  } else if(mode==="incorrect"){
    const stats = getStats();
    const badIds = Object.keys(stats).filter(id=>stats[id].lastCorrect===false);
    const sourcePool = QUESTIONS.filter(q=>badIds.includes(q.id));
    if(sourcePool.length===0) return null;
    instances = buildTest({total:sourcePool.length, weeks:settings.weeks, difficulty:"Mixed",
      distMcq:60, distMsq:25, distNum:15, sourcePool});
    timerEnabled = false;
  }
  if(instances.length===0) return null;
 
  const test = {
    id:"test_"+Date.now(), mode:mode, startTime:Date.now(), marksPerQ:marksPerQ,
    timerEnabled: timerEnabled, timerTotalSec: FULL_MOCK_TIMER_SECONDS, timerRemaining: FULL_MOCK_TIMER_SECONDS,
    instances: instances, currentIndex:0,
    answers: instances.map(()=>({submitted:false,userAnswer:null,isCorrect:null,marks:0}))
  };
  saveCurrent(test);
  return test;
}
 
function submitAnswer(userAnswer){
  const test = getCurrent();
  if(!test) return;
  const idx = test.currentIndex;
  const ans = test.answers[idx];
  if(ans.submitted) return;
  const inst = test.instances[idx];
  let isCorrect = false;
  if(inst.type==="mcq"){
    isCorrect = inst.correctIdx.length===1 && userAnswer===inst.correctIdx[0];
  } else if(inst.type==="msq"){
    const u = (userAnswer||[]).slice().sort();
    const c = inst.correctIdx.slice().sort();
    isCorrect = u.length===c.length && u.every((v,i)=>v===c[i]);
  } else if(inst.type==="numeric"){
    const v = parseFloat(userAnswer);
    isCorrect = !isNaN(v) && Math.abs(v - inst.numAns.v) <= (inst.numAns.tol||0.01);
  }
  ans.submitted = true;
  ans.userAnswer = userAnswer;
  ans.isCorrect = isCorrect;
  ans.marks = isCorrect ? test.marksPerQ : 0;
 
  const stats = getStats();
  if(!stats[inst.qid]) stats[inst.qid] = {attempted:0,correct:0,incorrect:0,lastCorrect:null};
  stats[inst.qid].attempted++;
  if(isCorrect) stats[inst.qid].correct++; else stats[inst.qid].incorrect++;
  stats[inst.qid].lastCorrect = isCorrect;
  saveStats(stats);
  saveCurrent(test);
}
 
function finishTest(){
  const test = getCurrent();
  if(!test) return null;
  const total = test.instances.length;
  let correct=0, incorrect=0, score=0;
  const weekBreakdown = {}, typeBreakdown = {mcq:{correct:0,total:0},msq:{correct:0,total:0},numeric:{correct:0,total:0}};
  const details = test.instances.map((inst,i)=>{
    const a = test.answers[i];
    const ok = a.submitted ? a.isCorrect : false;
    if(a.submitted && ok) correct++; else incorrect++;
    score += a.marks||0;
    if(!weekBreakdown[inst.week]) weekBreakdown[inst.week] = {correct:0,total:0};
    weekBreakdown[inst.week].total++;
    if(a.submitted && ok) weekBreakdown[inst.week].correct++;
    typeBreakdown[inst.type].total++;
    if(a.submitted && ok) typeBreakdown[inst.type].correct++;
    return {qid:inst.qid, week:inst.week, type:inst.type, diff:inst.diff, question:inst.question,
      options:inst.options, correctIdx:inst.correctIdx, numAns:inst.numAns, src:inst.src, exp:inst.exp,
      userAnswer:a.userAnswer, isCorrect:a.submitted?a.isCorrect:false, submitted:a.submitted, marks:a.marks||0};
  });
  const timeSec = test.timerEnabled ? (test.timerTotalSec - test.timerRemaining) : Math.round((Date.now()-test.startTime)/1000);
  const record = {
    id: test.id, date: nowISO(), mode: test.mode, total: total, correct: correct, incorrect: incorrect,
    score: Math.round(score*100)/100, maxScore: Math.round(total*test.marksPerQ*100)/100,
    accuracy: total? Math.round((correct/total)*1000)/10 : 0, timeSec: timeSec,
    weekBreakdown: weekBreakdown, typeBreakdown: typeBreakdown, details: details
  };
  const hist = getHistory();
  hist.unshift(record);
  if(hist.length>300) hist.length = 300;
  saveHistory(hist);
  clearCurrent();
  return record;
}

function aggregateStats(){
  const stats = getStats();
  const hist = getHistory();
  const attemptedQ = Object.keys(stats).filter(id=>stats[id].attempted>0);
  let totalCorrectAttempts=0, totalIncorrectAttempts=0;
  attemptedQ.forEach(id=>{ totalCorrectAttempts += stats[id].correct; totalIncorrectAttempts += stats[id].incorrect; });
  const accuracy = (totalCorrectAttempts+totalIncorrectAttempts)>0 ? (totalCorrectAttempts/(totalCorrectAttempts+totalIncorrectAttempts)*100) : 0;
  const bestScore = hist.length ? Math.max(...hist.map(h=>h.score)) : 0;
  const avgScore = hist.length ? (hist.reduce((s,h)=>s+h.score,0)/hist.length) : 0;
  return {stats, hist, attemptedQ, totalCorrectAttempts, totalIncorrectAttempts, accuracy, bestScore, avgScore};
}
 
function weekProgressRows(stats){
  let rows = "";
  for(let w=1; w<=8; w++){
    const weekQs = QUESTIONS.filter(q=>q.week===w);
    const attempted = weekQs.filter(q=>stats[q.id] && stats[q.id].attempted>0).length;
    const pct = weekQs.length ? Math.round((attempted/weekQs.length)*100) : 0;
    rows += '<div class="week-row"><div class="wk-label">Week '+w+'</div>'+
      '<div class="progress-track"><div class="progress-fill" style="width:'+pct+'%"></div></div>'+
      '<div class="wk-pct">'+attempted+'/'+weekQs.length+'</div></div>';
  }
  return rows;
}

  if(test.timerEnabled && !timerHandle){
    timerHandle = setInterval(function(){
      const t = getCurrent();
      if(!t){ clearInterval(timerHandle); timerHandle=null; return; }
      t.timerRemaining--;
      if(t.timerRemaining<=0){
        t.timerRemaining = 0;
        saveCurrent(t);
        clearInterval(timerHandle); timerHandle=null;
        const rec = finishTest();
        VIEW_PARAM = rec;
        navigate("result");
        return;
      }
      saveCurrent(t);
      const box = document.getElementById("timer-box");
      if(box){ box.textContent = fmtTime(t.timerRemaining); if(t.timerRemaining<60) box.classList.add("low"); }
    }, 1000);
  }
}
window.__forceFinish = function(){
  const t = getCurrent();
  if(t){
    // mark unanswered as submitted-incorrect for scoring purposes (kept unsubmitted=false in details logic)
  }
  const rec = finishTest();
  navigate("result");
};
 
function selectMcq(i){
  const test = getCurrent();
  test.answers[test.currentIndex].userAnswer = i;
  saveCurrent(test);
  renderTesting(document.getElementById("view"));
}
function toggleMsq(i){
  const test = getCurrent();
  const ans = test.answers[test.currentIndex];
  if(!Array.isArray(ans.userAnswer)) ans.userAnswer = [];
  const pos = ans.userAnswer.indexOf(i);
  if(pos>=0) ans.userAnswer.splice(pos,1); else ans.userAnswer.push(i);
  saveCurrent(test);
  renderTesting(document.getElementById("view"));
}
function handleSubmit(){
  const test = getCurrent();
  const inst = test.instances[test.currentIndex];
  let value;
  if(inst.type==="numeric"){
    const el = document.getElementById("num-input");
    value = el ? el.value : "";
    if(value===""){ alert("Please enter a numeric answer."); return; }
  } else if(inst.type==="mcq"){
    value = test.answers[test.currentIndex].userAnswer;
    if(value===null || value===undefined){ alert("Please select an option."); return; }
  } else {
    value = test.answers[test.currentIndex].userAnswer || [];
    if(value.length===0){ alert("Please select at least one option."); return; }
  }
  window.__numDraft = "";
  submitAnswer(value);
  renderTesting(document.getElementById("view"));
}
function handleNext(){
  const test = getCurrent();
  test.currentIndex++;
  window.__numDraft = "";
  if(test.currentIndex>=test.instances.length){
    saveCurrent(test);
    const rec = finishTest();
    navigate("result");
  } else {
    saveCurrent(test);
    renderTesting(document.getElementById("view"));
  }
}

function retryIncorrectFrom(testId){
  const hist = getHistory();
  const rec = hist.find(h=>h.id===testId);
  if(!rec){ startAndGo("incorrect"); return; }
  const badIds = rec.details.filter(d=>!d.isCorrect).map(d=>d.qid);
  if(badIds.length===0){ alert("No incorrect questions in this test — great job!"); return; }
  const sourcePool = QUESTIONS.filter(q=>badIds.includes(q.id));
  const instances = buildTest({total:sourcePool.length, weeks:[1,2,3,4,5,6,7,8], difficulty:"Mixed",
    distMcq:60, distMsq:25, distNum:15, sourcePool});
  if(instances.length===0){ alert("Could not build a retry test."); return; }
  const settings = getSettings();
  const test = {
    id:"test_"+Date.now(), mode:"incorrect", startTime:Date.now(), marksPerQ:settings.marksPerQ,
    timerEnabled:false, timerTotalSec:0, timerRemaining:0,
    instances: instances, currentIndex:0,
    answers: instances.map(()=>({submitted:false,userAnswer:null,isCorrect:null,marks:0}))
  };
  saveCurrent(test);
  navigate("testing");
}

let BANK_FILTERS = {week:null, type:null, status:null, search:""};
function renderBank(){
  const stats = getStats();
  const total = QUESTIONS.length;
  const mcqCount = QUESTIONS.filter(q=>q.type==="mcq").length;
  const msqCount = QUESTIONS.filter(q=>q.type==="msq").length;
  const numCount = QUESTIONS.filter(q=>q.type==="numeric").length;
 
  let filtered = QUESTIONS.filter(q=>{
    if(BANK_FILTERS.week && q.week!==BANK_FILTERS.week) return false;
    if(BANK_FILTERS.type && q.type!==BANK_FILTERS.type) return false;
    if(BANK_FILTERS.status){
      const st = stats[q.id];
      if(BANK_FILTERS.status==="unattempted" && st && st.attempted>0) return false;
      if(BANK_FILTERS.status==="correct" && !(st && st.lastCorrect===true)) return false;
      if(BANK_FILTERS.status==="incorrect" && !(st && st.lastCorrect===false)) return false;
    }
    if(BANK_FILTERS.search && !q.q.toLowerCase().includes(BANK_FILTERS.search.toLowerCase())) return false;
    return true;
  });
 
  const weekChips = [1,2,3,4,5,6,7,8].map(w=>chip("W"+w, BANK_FILTERS.week===w, "setBankFilter('week',"+w+")")).join("");
  const typeChips = ["mcq","msq","numeric"].map(t=>chip(t.toUpperCase(), BANK_FILTERS.type===t, "setBankFilter('type','"+t+"')")).join("");
  const statusChips = [["correct","Correct"],["incorrect","Incorrect"],["unattempted","Unattempted"]].map(s=>chip(s[1], BANK_FILTERS.status===s[0], "setBankFilter('status','"+s[0]+"')")).join("");
 
  const items = filtered.slice(0,300).map(q=>{
    const st = stats[q.id];
    let statusBadge = '<span class="badge">Unattempted</span>';
    if(st && st.attempted>0){
      statusBadge = st.lastCorrect ? '<span class="badge badge-good">&#10003; Correct</span>' : '<span class="badge badge-bad">&#10007; Incorrect</span>';
    }
    return '<div class="qbank-item"><div class="qbank-top"><span class="badge badge-accent">Week '+q.week+'</span><span class="badge">'+q.type.toUpperCase()+'</span><span class="badge">'+q.diff+'</span>'+statusBadge+'</div>'+
      '<div class="qbank-q">'+escapeHtml(q.q)+'</div></div>';
  }).join("");
 
  return '<div class="header-row"><div><h1 class="page-title">Question Bank</h1><div class="page-sub">Every question is traceable to the uploaded Week 1–8 course PDFs.</div></div></div>'+
    '<div class="grid grid-stats" style="margin-bottom:20px;">'+
      statCard("Total Questions", total, "in the bank")+
      statCard("MCQs", mcqCount, "single-answer")+
      statCard("MSQs", msqCount, "multi-select")+
      statCard("Numerical", numCount, "integer / float")+
    '</div>'+
    '<input class="search-input" placeholder="Search questions by keyword…" value="'+escapeHtml(BANK_FILTERS.search)+'" oninput="setBankSearch(this.value)">'+
    '<div class="filter-bar">'+weekChips+'</div>'+
    '<div class="filter-bar">'+typeChips+statusChips+'<span class="chip" onclick="clearBankFilters()">Clear filters</span></div>'+
    '<div class="card" style="padding:4px 0;">'+(items || '<div class="empty-state">No questions match these filters.</div>')+'</div>'+
    (filtered.length>300 ? '<div class="small-note" style="margin-top:8px;">Showing first 300 of '+filtered.length+' matches.</div>' : '');
}
function chip(label, active, onclick){
  return '<span class="chip '+(active?'active':'')+'" onclick="'+onclick+'">'+label+'</span>';
}
function setBankFilter(key, val){
  BANK_FILTERS[key] = (BANK_FILTERS[key]===val) ? null : val;
  render();
}
function setBankSearch(v){ BANK_FILTERS.search = v; document.getElementById("view").innerHTML = renderBank(); }
function clearBankFilters(){ BANK_FILTERS = {week:null,type:null,status:null,search:""}; render(); }
 
/* =========================================================================
   PROGRESS / ANALYTICS
   ========================================================================= */
function renderProgress(){
  const stats = getStats();
  const hist = getHistory().slice().reverse(); // chronological
 
  const scoreRows = hist.length ? hist.slice(-10).map((h,i)=>{
    const pct = h.maxScore? Math.round((h.score/h.maxScore)*100) : 0;
    return '<div class="bar-chart-row"><div class="lab">Test '+(hist.length-10+i+1>0?hist.length-Math.max(0,hist.length-10)+i+1:i+1)+'</div><div class="progress-track"><div class="progress-fill" style="width:'+pct+'%"></div></div><div class="val">'+fmt1(h.score)+'</div></div>';
  }).join("") : '<div class="empty-state">Complete a mock test to see score trends.</div>';
 
  const accRows = hist.length ? hist.slice(-10).map((h,i)=>{
    return '<div class="bar-chart-row"><div class="lab">Test '+(i+1)+'</div><div class="progress-track"><div class="progress-fill" style="width:'+h.accuracy+'%"></div></div><div class="val">'+h.accuracy+'%</div></div>';
  }).join("") : '';
 
  const weekAcc = [];
  for(let w=1; w<=8; w++){
    const weekQs = QUESTIONS.filter(q=>q.week===w);
    let correct=0, attempted=0;
    weekQs.forEach(q=>{ const st = stats[q.id]; if(st && st.attempted>0){ attempted += st.attempted; correct += st.correct; }});
    weekAcc.push({week:w, pct: attempted? Math.round((correct/attempted)*100) : null, attempted});
  }
  const weekAccRows = weekAcc.map(w=>{
    const pct = w.pct===null ? 0 : w.pct;
    return '<div class="bar-chart-row"><div class="lab">Week '+w.week+'</div><div class="progress-track"><div class="progress-fill" style="width:'+pct+'%"></div></div><div class="val">'+(w.pct===null?'—':pct+'%')+'</div></div>';
  }).join("");
 
  const typeAcc = ["mcq","msq","numeric"].map(t=>{
    const qs = QUESTIONS.filter(q=>q.type===t);
    let correct=0, attempted=0;
    qs.forEach(q=>{ const st=stats[q.id]; if(st&&st.attempted>0){attempted+=st.attempted; correct+=st.correct;}});
    return {t, pct: attempted? Math.round((correct/attempted)*100): null};
  });
  const typeAccRows = typeAcc.map(o=>{
    const pct = o.pct===null?0:o.pct;
    return '<div class="bar-chart-row"><div class="lab">'+o.t.toUpperCase()+'</div><div class="progress-track"><div class="progress-fill" style="width:'+pct+'%"></div></div><div class="val">'+(o.pct===null?'—':pct+'%')+'</div></div>';
  }).join("");
 
  const diffAcc = ["Easy","Medium","Hard"].map(d=>{
    const qs = QUESTIONS.filter(q=>q.diff===d);
    let correct=0, attempted=0;
    qs.forEach(q=>{ const st=stats[q.id]; if(st&&st.attempted>0){attempted+=st.attempted; correct+=st.correct;}});
    return {d, pct: attempted? Math.round((correct/attempted)*100): null};
  });
  const diffAccRows = diffAcc.map(o=>{
    const pct = o.pct===null?0:o.pct;
    return '<div class="bar-chart-row"><div class="lab">'+o.d+'</div><div class="progress-track"><div class="progress-fill" style="width:'+pct+'%"></div></div><div class="val">'+(o.pct===null?'—':pct+'%')+'</div></div>';
  }).join("");
 
  const needsPractice = weekAcc.filter(w=>w.attempted>0).sort((a,b)=>a.pct-b.pct).slice(0,3);
  const needsHtml = needsPractice.length ? needsPractice.map(w=>
    '<div class="history-item" onclick="startAndGo(\'week\',{weeks:['+w.week+'],count:15})"><div><b>Week '+w.week+'</b> — '+WEEK_TITLES[w.week]+'<div class="small-note">Accuracy '+w.pct+'%</div></div><span class="badge">Practice &rarr;</span></div>'
  ).join("") : '<div class="empty-state">Attempt some questions to see personalised recommendations.</div>';
 
  return '<div class="header-row"><div><h1 class="page-title">Progress Analytics</h1><div class="page-sub">Based only on your actual performance in this browser.</div></div></div>'+
    '<div class="grid grid-2">'+
      '<div class="card"><h3>Score over time</h3>'+scoreRows+'</div>'+
      '<div class="card"><h3>Accuracy over time</h3>'+(accRows || '<div class="empty-state">No data yet.</div>')+'</div>'+
    '</div>'+
    '<div class="grid grid-2" style="margin-top:14px;">'+
      '<div class="card"><h3>Week-wise accuracy</h3>'+weekAccRows+'</div>'+
      '<div class="grid" style="gap:14px;">'+
        '<div class="card"><h3>Question-type performance</h3>'+typeAccRows+'</div>'+
        '<div class="card"><h3>Difficulty performance</h3>'+diffAccRows+'</div>'+
      '</div>'+
    '</div>'+
    '<div class="section-title">Topics that need more practice</div>'+
    '<div class="card" style="padding:4px 0;">'+needsHtml+'</div>';
}
